<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG - Temporary Live Connection</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000000;
            color: #0f0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            animation: fadeIn 1s ease-in;
        }

        .logo {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 60px #0f0;
            animation: glowPulse 2s ease-in-out infinite;
            letter-spacing: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #0a0;
            margin-top: 10px;
            letter-spacing: 3px;
        }

        .panel {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 10px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
        }

        .id-section {
            text-align: center;
        }

        .id-label {
            font-size: 0.9rem;
            color: #0a0;
            margin-bottom: 10px;
        }

        .id-display {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
            letter-spacing: 5px;
            margin: 15px 0;
        }

        .btn {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px 30px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            border-color: #f00;
            color: #f00;
        }

        .btn-danger:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 20px #f00;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            background: rgba(0, 20, 0, 0.9);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            border-radius: 5px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        input[type="text"]::placeholder {
            color: #050;
            letter-spacing: 2px;
        }

        .status {
            text-align: center;
            font-size: 0.9rem;
            color: #0a0;
            margin-top: 15px;
            min-height: 25px;
        }

        .video-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .video-section {
                grid-template-columns: 1fr;
            }
        }

        .video-container {
            position: relative;
            background: #000;
            border: 1px solid #0f0;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            border: 1px solid #0f0;
        }

        .video-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .chat-section {
            margin: 20px 0;
        }

        .chat-window {
            background: rgba(0, 20, 0, 0.9);
            border: 1px solid #0f0;
            border-radius: 10px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .chat-window::-webkit-scrollbar {
            width: 8px;
        }

        .chat-window::-webkit-scrollbar-track {
            background: #001000;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 4px;
        }

        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 70%;
            animation: slideIn 0.3s ease-out;
        }

        .message.you {
            background: rgba(0, 50, 0, 0.8);
            border: 1px solid #0f0;
            margin-left: auto;
            text-align: right;
        }

        .message.peer {
            background: rgba(0, 30, 0, 0.8);
            border: 1px solid #0a0;
            margin-right: auto;
        }

        .message-sender {
            font-size: 0.7rem;
            color: #0a0;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .message-text {
            word-wrap: break-word;
        }

        .message-time {
            font-size: 0.6rem;
            color: #050;
            margin-top: 5px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            text-align: left;
            letter-spacing: normal;
            text-transform: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 60px #0f0; }
            50% { text-shadow: 0 0 30px #0f0, 0 0 60px #0f0, 0 0 90px #0f0; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .flicker {
            animation: flicker 0.1s infinite;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2.5rem;
                letter-spacing: 5px;
            }

            .id-display {
                font-size: 1.8rem;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            input[type="text"] {
                font-size: 1rem;
                padding: 10px 15px;
            }

            .chat-window {
                height: 250px;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="container">
        <div class="header">
            <div class="logo">OMG</div>
            <div class="subtitle">Temporary Live Connection</div>
        </div>

        <div class="panel id-section">
            <div class="id-label">YOUR ID</div>
            <div class="id-display" id="my-id">---</div>
            <button class="btn" id="copy-btn" onclick="copyId()">COPY ID</button>
        </div>

        <div class="panel">
            <div class="id-label">ENTER PARTNER ID</div>
            <div class="input-group">
                <input type="text" id="partner-id" placeholder="6-CODE" maxlength="6">
                <button class="btn" id="connect-btn" onclick="connectToPeer()">CONNECT</button>
                <button class="btn btn-danger" id="disconnect-btn" onclick="disconnect()" style="display: none;">HANG UP</button>
            </div>
            <div class="status" id="status">INITIALIZING CONNECTION...</div>
        </div>

        <div class="panel video-section hidden" id="video-section">
            <div class="video-container">
                <div class="video-label">LOCAL</div>
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            <div class="video-container">
                <div class="video-label">REMOTE</div>
                <video id="remote-video" autoplay playsinline></video>
            </div>
        </div>

        <div class="video-controls hidden" id="video-controls">
            <button class="btn" id="mute-btn" onclick="toggleMute()">MUTE</button>
            <button class="btn" id="camera-btn" onclick="toggleCamera()">CAMERA OFF</button>
        </div>

        <div class="panel chat-section">
            <div class="chat-window" id="chat-window">
                <div class="message">
                    <div class="message-sender">SYSTEM</div>
                    <div class="message-text">Waiting for connection...</div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Type message..." maxlength="500" onkeypress="handleKeyPress(event)">
                <button class="btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Sound Effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch(type) {
                case 'connect':
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;
                case 'message':
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;
                case 'disconnect':
                    oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;
            }
        }

        // ID Generation
        function generateId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let id = '';
            for (let i = 0; i < 6; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        const myId = generateId();
        document.getElementById('my-id').textContent = myId;

        // Copy ID
        function copyId() {
            navigator.clipboard.writeText(myId).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = 'COPIED!';
                setTimeout(() => {
                    btn.textContent = 'COPY ID';
                }, 1500);
            });
        }

        // PeerJS Setup
        let peer;
        let conn;
        let localStream;
        let call;
        let isMuted = false;
        let isCameraOn = true;

        function initPeer() {
            peer = new Peer(myId);

            peer.on('open', (id) => {
                document.getElementById('status').textContent = 'WAITING FOR PEER';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('call', (incomingCall) => {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        localStream = stream;
                        document.getElementById('local-video').srcObject = stream;
                        incomingCall.answer(stream);
                        call = incomingCall;
                        
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remote-video').srcObject = remoteStream;
                        });

                        showVideoSection();
                        document.getElementById('status').textContent = 'PEER CONNECTED';
                        playSound('connect');
                    })
                    .catch(err => {
                        console.error('Error getting media:', err);
                        document.getElementById('status').textContent = 'CAMERA ACCESS DENIED';
                    });
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                document.getElementById('status').textContent = 'CONNECTION ERROR';
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('status').textContent = 'LINK ESTABLISHED';
                document.getElementById('connect-btn').style.display = 'none';
                document.getElementById('disconnect-btn').style.display = 'inline-block';
                document.getElementById('partner-id').disabled = true;
                playSound('connect');
                addSystemMessage('Connected to peer');
            });

            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    addChatMessage(data.message, 'peer');
                    playSound('message');
                }
            });

            conn.on('close', () => {
                handleDisconnect();
            });

            conn.on('error', (err) => {
                console.error('Connection error:', err);
                handleDisconnect();
            });
        }

        function connectToPeer() {
            const partnerId = document.getElementById('partner-id').value.toUpperCase().trim();
            
            if (partnerId.length !== 6) {
                document.getElementById('status').textContent = 'INVALID ID (MUST BE 6 CHARACTERS)';
                return;
            }

            if (partnerId === myId) {
                document.getElementById('status').textContent = 'CANNOT CONNECT TO YOURSELF';
                return;
            }

            document.getElementById('status').textContent = 'CONNECTING...';

            conn = peer.connect(partnerId);
            setupConnection();

            // Initiate video call
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                    call = peer.call(partnerId, stream);
                    
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                        showVideoSection();
                        document.getElementById('status').textContent = 'PEER CONNECTED';
                    });

                    call.on('close', () => {
                        handleDisconnect();
                    });
                })
                .catch(err => {
                    console.error('Error getting media:', err);
                    document.getElementById('status').textContent = 'CAMERA ACCESS DENIED';
                });
        }

        function showVideoSection() {
            document.getElementById('video-section').classList.remove('hidden');
            document.getElementById('video-controls').classList.remove('hidden');
        }

        function hideVideoSection() {
            document.getElementById('video-section').classList.add('hidden');
            document.getElementById('video-controls').classList.add('hidden');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message || !conn || !conn.open) {
                return;
            }

            // Sanitize message
            const sanitizedMessage = sanitizeMessage(message);

            if (sanitizedMessage.length === 0) {
                return;
            }

            conn.send({ type: 'chat', message: sanitizedMessage });
            addChatMessage(sanitizedMessage, 'you');
            input.value = '';
        }

        function sanitizeMessage(message) {
            // Remove HTML tags and limit length
            const temp = document.createElement('div');
            temp.textContent = message;
            const sanitized = temp.innerHTML;
            return sanitized.substring(0, 500);
        }

        function addChatMessage(message, sender) {
            const chatWindow = document.getElementById('chat-window');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.textContent = sender === 'you' ? 'YOU' : 'PEER';

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = message;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            const now = new Date();
            timeDiv.textContent = now.toLocaleTimeString();

            messageDiv.appendChild(senderDiv);
            messageDiv.appendChild(textDiv);
            messageDiv.appendChild(timeDiv);

            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addSystemMessage(message) {
            const chatWindow = document.getElementById('chat-window');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.textContent = 'SYSTEM';

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = message;

            messageDiv.appendChild(senderDiv);
            messageDiv.appendChild(textDiv);

            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function toggleMute() {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
                document.getElementById('mute-btn').textContent = isMuted ? 'UNMUTE' : 'MUTE';
            }
        }

        function toggleCamera() {
            if (localStream) {
                isCameraOn = !isCameraOn;
                localStream.getVideoTracks().forEach(track => {
                    track.enabled = isCameraOn;
                });
                document.getElementById('camera-btn').textContent = isCameraOn ? 'CAMERA OFF' : 'CAMERA ON';
            }
        }

        function disconnect() {
            if (call) {
                call.close();
            }
            if (conn) {
                conn.close();
            }
            handleDisconnect();
        }

        function handleDisconnect() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            
            hideVideoSection();
            document.getElementById('status').textContent = 'TRANSMISSION LOST';
            document.getElementById('connect-btn').style.display = 'inline-block';
            document.getElementById('disconnect-btn').style.display = 'none';
            document.getElementById('partner-id').disabled = false;
            document.getElementById('partner-id').value = '';
            
            addSystemMessage('Disconnected');
            playSound('disconnect');

            // Reinitialize peer for new connections
            setTimeout(() => {
                initPeer();
            }, 1000);
        }

        // Initialize
        initPeer();

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (peer) {
                peer.destroy();
            }
        });
    </script>
</body>
</html>
